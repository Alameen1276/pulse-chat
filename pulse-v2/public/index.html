<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Log in</title>
  <script src="theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="join">
  <section class="stage" aria-label="About Pulse">
    <div class="brand-row">
      <div class="logo" id="logo"></div>
      Pulse
    </div>

    <div>
      <h1>Say it, send it, or call it.</h1>
      <p class="lead">Messages, voice notes, photos, and voice or video calls, all in one conversation.</p>
    </div>

    <div class="mock" aria-hidden="true">
      <div class="mb in">Are you free for a quick call?</div>
      <div class="mb out voice">
        <span class="p"><svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></span>
        <span class="bars" id="mockBars"></span>
        <span>0:07</span>
      </div>
      <div class="mb call" id="mockCall"><span id="mockCallIcon"></span>Video call · 04:12</div>
      <div class="mb out">Perfect, joining now</div>
    </div>
  </section>

  <section class="join-side">
    <button class="icon-btn theme-fab" id="themeBtn" aria-label="Switch light or dark theme"></button>

    <div class="card" id="card"></div>
  </section>
</main>

<script src="common.js"></script>
<script>
  // Decorative bits
  document.getElementById('logo').append(icon('bubble'));
  document.getElementById('mockCallIcon').append(icon('video'));
  const bars = document.getElementById('mockBars');
  [8,14,20,12,22,16,9,18,24,14,8,17,21,11,15,7].forEach(v => bars.append(h('i', { style: `height:${v}px` })));

  const themeBtn = document.getElementById('themeBtn');
  const paintTheme = () => { themeBtn.replaceChildren(icon(currentTheme() === 'dark' ? 'sun' : 'moon')); };
  themeBtn.onclick = () => { setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); paintTheme(); };
  paintTheme();

  // Join logic: sign up / log in
  const card = document.getElementById('card');
  const saved = getProfile();

  async function api(path, body) {
    let res;
    try {
      res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) {
      return { ok: false, error: 'Cannot reach the server. Check your internet and try again.' };
    }
    try { return await res.json(); } catch (e) { return { ok: false, error: 'Something went wrong. Try again.' }; }
  }

  function go(profile, remember) {
    saveProfile(profile, remember);
    location.href = 'chat.html';
  }

  function showWelcome() {
    card.replaceChildren(
      h('h2', { text: 'Welcome back' }),
      h('p', { class: 'sub', text: 'You are signed in on this device.' }),
      h('div', { class: 'welcome' },
        avatarEl(saved, 60),
        h('div', {}, h('b', { text: saved.name }), h('span', { text: 'Saved on this device' }))
      ),
      h('button', { class: 'btn primary', text: 'Continue as ' + saved.name, onclick: () => go(saved, !!localStorage.getItem(PROFILE_KEY)) }),
      h('button', { class: 'btn ghost', style: 'width:100%;margin-top:6px', text: 'Use a different account', onclick: () => showForm('login') })
    );
  }

  function showForm(mode) {
    const signup = mode === 'signup';
    let color = COLORS[Math.floor(Math.random() * COLORS.length)];
    let remember = true;

    const nameIn = h('input', { class: 'text-in', id: 'name', type: 'text', maxlength: '24', placeholder: 'e.g. Al-ameen', autocomplete: 'username' });
    const passIn = h('input', { class: 'text-in', id: 'pass', type: 'password', maxlength: '100', placeholder: signup ? 'At least 6 characters' : 'Your password', autocomplete: signup ? 'new-password' : 'current-password' });
    const err = h('div', { class: 'err', role: 'alert' });
    const preview = h('div', {});
    const swatchWrap = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Avatar color' });
    const tog = h('button', { type: 'button', class: 'tog', role: 'switch', 'aria-checked': 'true', 'aria-label': 'Remember me on this device' });
    const submitBtn = h('button', { class: 'btn primary', type: 'submit', text: signup ? 'Create account' : 'Log in' });

    function paint() {
      preview.replaceChildren(avatarEl({ name: nameIn.value || '?', color }, 52));
      [...swatchWrap.children].forEach((sw) => sw.setAttribute('aria-checked', String(sw.dataset.c === color)));
    }
    COLORS.forEach((c) => swatchWrap.append(h('button', { type: 'button', class: 'swatch', role: 'radio', 'data-c': c, 'aria-label': c, style: `background:${c}`, onclick: () => { color = c; paint(); } })));
    tog.onclick = () => { remember = !remember; tog.setAttribute('aria-checked', String(remember)); };
    nameIn.addEventListener('input', () => { err.textContent = ''; paint(); });
    passIn.addEventListener('input', () => { err.textContent = ''; });

    async function submit(e) {
      e.preventDefault();
      const name = nameIn.value.trim();
      const password = passIn.value;
      if (name.length < 2) { err.textContent = 'Enter a name with at least 2 characters.'; nameIn.focus(); return; }
      if (signup && password.length < 6) { err.textContent = 'Your password must be at least 6 characters.'; passIn.focus(); return; }
      if (!signup && !password) { err.textContent = 'Enter your password.'; passIn.focus(); return; }
      submitBtn.disabled = true;
      const res = await api(signup ? '/api/signup' : '/api/login', signup ? { name, password, color } : { name, password });
      if (!res.ok) { err.textContent = res.error || 'Something went wrong. Try again.'; submitBtn.disabled = false; return; }
      go(res.profile, remember);
    }

    const tabs = h('div', { class: 'tabs', role: 'tablist' },
      h('button', { type: 'button', role: 'tab', 'aria-selected': String(!signup), text: 'Log in', onclick: () => showForm('login') }),
      h('button', { type: 'button', role: 'tab', 'aria-selected': String(signup), text: 'Sign up', onclick: () => showForm('signup') })
    );

    const form = h('form', { onsubmit: submit, novalidate: true },
      h('div', { class: 'field tight' },
        h('label', { for: 'name', text: 'Your name' }),
        h('div', { class: 'input-wrap' }, signup ? preview : null, nameIn)
      ),
      h('div', { class: 'field tight' },
        h('label', { for: 'pass', text: 'Password' }),
        passIn,
        err
      ),
      signup ? h('div', { class: 'field tight' }, h('span', { class: 'lab', text: 'Avatar color' }), swatchWrap) : null,
      h('div', { class: 'switch' },
        h('div', {}, h('b', { text: 'Remember me' }), h('span', { text: 'Stay signed in on this device' })),
        tog
      ),
      submitBtn
    );

    card.replaceChildren(
      h('h2', { text: signup ? 'Create your account' : 'Welcome back' }),
      h('p', { class: 'sub', text: signup ? 'Pick a name and a password. Your name is how friends find you.' : 'Log in with your name and password.' }),
      tabs,
      form
    );
    paint();
    nameIn.focus();
  }

  saved ? showWelcome() : showForm('login');
</script>
</body>
</html>
